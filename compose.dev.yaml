# Инфраструктура для разработки: PostgreSQL, Redis и Kafka в контейнерах
# с портами на localhost. Сервисы запускаются из исходников (make run, goreman, отладчик VS Code).
#   docker compose -f compose.dev.yaml up -d     # поднять
#   docker compose -f compose.dev.yaml down      # остановить (данные PostgreSQL сохранятся)
# Пароли берутся из .env этого репозитория (те же переменные, что и для compose.yaml).

name: date-wishlist-hub-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?задайте USER_DB_PASSWORD в .env}
      PLACE_DB_PASSWORD: ${PLACE_DB_PASSWORD:?задайте PLACE_DB_PASSWORD в .env}
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:?задайте NOTIFY_DB_PASSWORD в .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # С PostgreSQL 18 том монтируется в /var/lib/postgresql, а не в .../data
      - postgres-data:/var/lib/postgresql
      # Тот же скрипт, что и в compose.yaml: пользователи и базы user_svc, place_svc, notify_svc
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Клиентам брокер сообщает localhost:9092 - сервисы, запущенные в Ubuntu, подключаются напрямую
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Создаёт топик и завершается. Работает в сетевом пространстве kafka,
  # поэтому localhost:9092 здесь - сам брокер
  kafka-init:
    image: apache/kafka:4.0.0
    network_mode: "service:kafka"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server=localhost:9092
      - --create
      - --if-not-exists
      - --topic=place.created
      - --partitions=1
      - --replication-factor=1

volumes:
  postgres-data:
